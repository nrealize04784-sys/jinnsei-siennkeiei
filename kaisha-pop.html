<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会社概要｜ライフメイクパートナーズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 本体LPと同じ約束。黒フチ＋ベタ塗り＋影なし。ぼかす影とグラデーションは使わない */
  :root{
    --paper:#F7EFDE;--ink:#141414;--pink:#F5378F;--cyan:#27C0D4;--lemon:#FFD84D;
    --line:4px;--r:18px;--hdr:60px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",sans-serif;font-size:16px;line-height:1.9;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1{font-family:"Dela Gothic One","Noto Sans JP",sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.35}
  .btn,.tg{font-family:"M PLUS Rounded 1c","Noto Sans JP",sans-serif;font-weight:800}
  .wrap{width:min(760px,calc(100% - 36px));margin-inline:auto}

  /* ヘッダー */
  .site-header{position:fixed;top:0;left:0;right:0;z-index:30;height:var(--hdr);background:var(--paper);border-bottom:var(--line) solid transparent;transition:border-color .3s ease}
  .site-header.scrolled{border-bottom-color:var(--ink)}
  .site-header .wrap{width:min(1040px,calc(100% - 36px));height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .hdr-brand{display:flex;align-items:center;gap:9px;text-decoration:none}
  /* ロゴPNGの地は白。クリームの上だと白い四角が浮くので、乗算で下地に溶かす */
  .hdr-logo,.hdr-word,.footer-logo{width:auto;object-fit:contain;mix-blend-mode:multiply}
  .hdr-logo{height:31px}.hdr-word{height:12px}
  @media (min-width:768px){.hdr-logo{height:37px}.hdr-word{height:14px}}
  @media (max-width:520px){.hdr-word{display:none}}
  .site-header nav{display:flex;align-items:center;gap:18px}
  .site-header nav a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
  .hdr-cta1,.hdr-cta2{border:3px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:800!important;font-family:"M PLUS Rounded 1c",sans-serif}
  .hdr-cta1{background:var(--pink);color:#fff!important}
  @media (max-width:767px){.hdr-cta1,.hdr-cta2{display:none}.site-header nav{gap:15px}}

  /* 見出し帯。地はタイル壁 */
  .ph{
    padding:calc(var(--hdr) + 40px) 0 40px;text-align:center;
    background-color:var(--cyan);
    background-image:linear-gradient(rgba(255,255,255,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.55) 2px,transparent 2px);
    background-size:44px 44px;
    border-bottom:var(--line) solid var(--ink);
  }
  .onsen{display:block;width:64px;height:auto;margin:0 auto 10px}
  @media (min-width:768px){.onsen{width:88px}}
  h1{color:var(--pink);margin:0 0 12px;font-size:clamp(30px,7vw,52px);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
  @media (min-width:768px){h1{-webkit-text-stroke-width:10px}}
  .ph-sub{margin:0;font-weight:700;font-size:15px}
  @media (min-width:768px){.ph-sub{font-size:17px}}

  main{padding:56px 0 72px}

  /* 電飾の枠。看板と同じ作り */
  .sign{position:relative;background:var(--pink);border:var(--line) solid var(--ink);border-radius:var(--r);padding:12px}
  @media (min-width:768px){.sign{padding:16px}}
  .sign-inner{
    border:3px solid var(--ink);border-radius:10px;padding:26px 18px;
    background-color:var(--paper);
    background-image:radial-gradient(circle 2px at center,rgba(245,55,143,.35) 0 2px,transparent 2px);
    background-size:16px 16px;
  }
  @media (min-width:768px){.sign-inner{padding:36px 34px}}
  .bulbs{position:absolute;pointer-events:none}
  .bulbs.t,.bulbs.b{left:22px;right:22px;height:20px;background-image:radial-gradient(circle 8px at center,var(--lemon) 0 5px,var(--ink) 5px 6.5px,transparent 6.5px);background-size:26px 20px;background-repeat:repeat-x}
  .bulbs.t{top:-4px}.bulbs.b{bottom:-4px}
  .bulbs.l,.bulbs.r{top:22px;bottom:22px;width:20px;background-image:radial-gradient(circle 8px at center,var(--lemon) 0 5px,var(--ink) 5px 6.5px,transparent 6.5px);background-size:20px 26px;background-repeat:repeat-y}
  .bulbs.l{left:-4px}.bulbs.r{right:-4px}

  .btn{display:inline-block;background:var(--pink);color:#fff;border:var(--line) solid var(--ink);border-radius:999px;padding:15px 32px;font-size:17px;text-decoration:none;transition:transform .15s ease}
  .btn:hover{transform:translateY(-2px)}
  .back{display:block;text-align:center;margin-top:36px;color:var(--ink);font-size:14px}

  footer{padding:36px 0;text-align:center}
  .footer-logo{height:38px}
  footer nav{display:flex;justify-content:center;gap:20px;margin:14px 0 12px}
  footer nav a{color:var(--ink);font-size:14px;text-decoration:none}
  .footer-copy{font-size:13px;color:#6B6155;margin:0}
  .footer-band{height:14px;border-top:var(--line) solid var(--ink);background-image:repeating-linear-gradient(90deg,var(--pink) 0 22px,var(--cyan) 22px 44px)}
</style>
<style>
  .info{margin:0}
  .info dt{font-weight:700;font-size:14px;color:#6B6155;margin-top:20px}
  .info dt:first-child{margin-top:0}
  .info dd{margin:2px 0 0;font-weight:500}
  .info .small{font-size:13px;color:#6B6155;margin-left:6px}
  @media (min-width:600px){
    /* 区切り線を1本につなげたいので列の隙間は空けず、dtの右padding で離す */
    .info{display:grid;grid-template-columns:144px 1fr}
    .info dt{margin-top:0;padding:14px 24px 14px 0;border-top:2px solid var(--ink)}
    .info dd{padding:14px 0;border-top:2px solid var(--ink)}
    .info dt:first-of-type,.info dt:first-of-type + dd{border-top:none;padding-top:0}
  }
</style>
</head>
