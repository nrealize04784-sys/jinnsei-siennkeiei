<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 180" width="1080" height="180" role="img" aria-label="LMP LIFE MAKE PARTNER'S">
  <!--
    横組みロゴ（暫定再現版）。ヘッダーとフッターの両方で使う。
    左に縦組みの完成形、右に欧文の社名を並べた構成。
    狭い画面ではマーク単体の logo-lmp-mark.svg に差し替わる。
    書体・線幅・比率は正規のロゴと一致していない。差し替え前提。
  -->
  <title>LMP / LIFE MAKE PARTNER'S</title>

  <!-- 左：縦組みの完成形（家・LMP・欧文）を 0.34 倍で置いている -->
  <g transform="translate(4,4) scale(0.34)">
    <path d="M70 252 L320 124 L570 252" fill="none" stroke="#17803d" stroke-width="40"
          stroke-linejoin="miter" stroke-miterlimit="10"/>
    <rect x="154" y="118" width="30" height="146" fill="#17803d"/>
    <path fill="#f5333f"
          d="M169 112 C134 88 141 62 155 62 C163 62 168 68 169 73 C170 68 175 62 183 62 C197 62 204 88 169 112 Z"/>
    <text x="320" y="396" text-anchor="middle"
          font-family="Arial Black, Arial Bold, Helvetica, Arial, sans-serif"
          font-weight="900" font-size="172" fill="#17803d">LMP</text>
    <text x="320" y="470" text-anchor="middle" textLength="536" lengthAdjust="spacingAndGlyphs"
          font-family="Arial Black, Arial Bold, Helvetica, Arial, sans-serif"
          font-weight="900" font-size="52" fill="#17803d">LIFE MAKE PARTNER'S</text>
  </g>

  <!--
    右：欧文の社名。
    R と S の間の記号は通常のアポストロフィではなくグッドマーク（親指を立てた手）なので、
    文字ではなく図形で描いている。そのぶん文字列を3つに割り、
    それぞれ textLength で幅を固定して、書体が違う環境でも位置がずれないようにしている。
  -->
  <text x="262" y="122" textLength="668" lengthAdjust="spacingAndGlyphs"
        font-family="Arial Black, Arial Bold, Helvetica, Arial, sans-serif"
        font-weight="900" font-size="92" fill="#17803d">LIFE MAKE PARTNER</text>
  <!--
    グッドマーク。左が手首、右が拳、上に立てた親指。
    傾けると小さい表示で引用符に見えてしまうため、垂直のまま置いている。
  -->
  <g transform="translate(940,48) scale(1.2)" fill="#17803d">
    <rect x="0" y="19" width="11" height="25" rx="3"/>
    <path d="M15 44 L15 22
             C15 15 19 6 23 3
             C26 1 29 3 29 7
             C29 11 27 15 26 18
             L36 18
             C41 18 44 22 42 27
             L38 40
             C37 43 35 44 32 44
             Z"/>
  </g>
  <text x="996" y="122" textLength="62" lengthAdjust="spacingAndGlyphs"
        font-family="Arial Black, Arial Bold, Helvetica, Arial, sans-serif"
        font-weight="900" font-size="92" fill="#17803d">S</text>
</svg>
