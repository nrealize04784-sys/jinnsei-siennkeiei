<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資料請求｜ライフメイクパートナーズ</title>
<meta name="description" content="不動産フランチャイズ加盟の資料請求はこちらから。1エリア2社限定の加盟募集。">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* 配色・書体・ヘッダー/フッター/フォームの枠組みは lp-star.html と完全に揃えている。 */
  :root{
    --bg2:#F5D343;       /* ヘッダーの地。lp-star.html のファーストビューと同じマスタード */
    --cream:#FBF3DD;
    --ink:#1B2A4A;
    --ink-soft:#4A5A78;
    --yellow:#F5C400;
    --yellow-deep:#A67B00;
    --red:#E2352B;
    --red-deep:#B8221B;
    --line:rgba(27,42,74,.14);
    --card:#FFFFFF;
    --r:16px;
    --hdr:56px;
  }
  @media (min-width:768px){ :root{ --hdr:68px } }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
    font-size:16px;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    letter-spacing:.02em;
  }
  p{margin:0}
  img{max-width:100%;display:block}
  .wrap{width:min(100% - 40px,880px);margin-inline:auto}

  /* ── 固定ヘッダー（lp-star.html と同じ） ── */
  .site-header{
    position:fixed;top:0;left:0;right:0;z-index:30;
    height:var(--hdr);
    background:var(--bg2);
    border-bottom:1px solid transparent;
    transition:background .3s ease,border-color .3s ease;
  }
  .site-header.scrolled{ border-bottom-color:var(--line) }
  .site-header .wrap{
    height:100%;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .hdr-brand{
    display:flex;align-items:center;gap:10px;
    text-decoration:none;color:var(--ink);
    font-weight:700;font-size:14px;letter-spacing:.06em;
    white-space:nowrap;
  }
  .hdr-lockup{display:flex;align-items:center;gap:8px}
  .hdr-logo,.hdr-word{width:auto;object-fit:contain;mix-blend-mode:multiply}
  .hdr-logo{height:32px}
  .hdr-word{height:13px}
  @media (min-width:768px){ .hdr-logo{height:38px} .hdr-word{height:15px} }
  @media (max-width:520px){ .hdr-word{display:none} }

  .hdr-nav{display:flex;align-items:center;gap:22px}
  .hdr-nav a,.hdr-nav [aria-current]{
    color:var(--ink-soft);text-decoration:none;
    font-size:14px;white-space:nowrap;
  }
  .hdr-nav [aria-current]{color:var(--ink);font-weight:700}
  .hdr-nav a:hover{color:var(--ink)}
  .hdr-cta{border-radius:10px;padding:9px 20px;background:var(--red);color:#fff !important}
  .hdr-cta:hover{background:var(--red-deep)}
  @media (max-width:900px){
    .hdr-nav{gap:14px}
    .hdr-nav a,.hdr-nav [aria-current]{font-size:13px}
    .hdr-cta{padding:8px 14px}
  }
  @media (max-width:767px){ .hdr-cta{display:none} }

  /* ── 本文 ── */
  main{padding:calc(var(--hdr) + 56px) 0 96px;text-align:center}
  @media (min-width:768px){ main{padding-top:calc(var(--hdr) + 92px)} }

  /* 見出しの札。lp-star.html のリボン札（ようこそ、この輪へ。）と同じ横組みの帯 */
  .page-tag{
    display:inline-block;
    background:var(--yellow);
    color:var(--ink);
    font-weight:700;
    font-size:clamp(18px,4.6vw,26px);
    letter-spacing:.16em;
    padding:14px 44px;
    clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%);
    box-shadow:0 6px 16px rgba(74,59,18,.14);
    margin-bottom:22px;
  }
  .lead{color:var(--ink-soft);font-size:15px;margin-bottom:14px}
  .desc{
    max-width:520px;margin:0 auto 44px;
    color:var(--ink-soft);font-size:14px;line-height:1.9;
  }

  /* ── フォーム（lp-star.html の最終CTAと同じ枠組み） ── */
  form{
    max-width:520px;
    margin-inline:auto;
    text-align:left;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r);
    padding:32px 24px;
  }
  .field{margin-bottom:20px}
  label{display:block;font-size:14px;margin-bottom:8px;color:var(--ink-soft)}
  input,textarea{
    width:100%;
    padding:15px 16px;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
  }
  /* 備考。数行書ける高さにし、縦だけ引き伸ばせるようにする */
  textarea{min-height:96px;resize:vertical;line-height:1.7;display:block}
  input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:transparent}
  .btn{
    display:block;width:100%;
    background:var(--red);
    color:#fff;
    text-align:center;
    text-decoration:none;
    font-weight:700;
    font-size:17px;
    font-family:inherit;
    padding:20px;
    margin-top:8px;
    border:0;
    border-radius:var(--r);
    cursor:pointer;
    transition:background .25s ease;
  }
  .btn:hover{background:var(--red-deep)}
  .req-note{
    max-width:520px;margin:24px auto 0;
    font-size:13px;line-height:1.9;color:var(--ink-soft);
  }
  .req-note a{color:var(--ink)}

  .back{
    display:inline-block;margin-top:44px;
    color:var(--ink-soft);text-decoration:none;font-size:14px;
  }
  .back:hover{color:var(--ink);text-decoration:underline}

  /* ── フッター（lp-star.html と同じ） ── */
  footer{
    padding:48px 0 40px;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
  footer a{color:var(--ink-soft);text-decoration:none;margin:0 12px}
  footer a:hover{color:var(--ink)}
  .footer-logo-link{display:inline-block;margin:0 0 22px}
  .footer-logo{width:min(220px,54vw);height:auto;mix-blend-mode:multiply}
  .footer-copy{margin-top:14px;font-size:12px}

  /* ── スマホ追従ボタン（lp-star.html と同じ、控えめな1本） ── */
  .sticky{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(245,211,67,.94);
    backdrop-filter:blur(6px);
    border-top:1px solid var(--line);
  }
  .sticky .btn{padding:14px;font-size:15px;border-radius:12px}
  @media (min-width:768px){ .sticky{display:none} }
  @media (max-width:767px){ body{padding-bottom:64px} }
</style>
</head>
<body>

<!-- 固定ヘッダー -->
<div class="site-header" id="site-header">
  <div class="wrap">
    <a class="hdr-brand" href="lp-star.html">
      <span class="hdr-lockup">
        <img class="hdr-logo" src="logo-lmp.png" alt="ライフメイクパートナーズ"
             onerror="this.closest('.hdr-lockup').remove()">
        <img class="hdr-word" src="logo-lmp-wordmark.png" alt="">
      </span>
    </a>
    <nav class="hdr-nav">
      <a href="lp-star.html">ホーム</a>
      <a href="kaisha-star.html">会社概要</a>
      <a class="hdr-cta" href="lp-star.html#entry">話を聞いてみる</a>
      <!-- 今このページなので、資料請求はリンクにせず現在地として見せる -->
      <span aria-current="page">資料請求</span>
    </nav>
  </div>
</div>

<main>
  <div class="wrap">
    <p class="page-tag">資料請求</p>
    <p class="lead">加盟の概要をまとめた資料をお送りします。</p>
    <p class="desc">
      仕組みと相談の流れ、実績をまとめた資料をお届けします。<br>
      届いてすぐのご契約や、しつこいご連絡はいたしません。
    </p>

    <!--
      送信先はメール（RC@n-realize.co.jp）。サーバー側の受け口が無いため、
      入力内容から本文を組み立ててメーラーを開く方式（lp-star.html と同じ）。
    -->
    <form id="req-form" novalidate>
      <div class="field">
        <label for="company">会社名</label>
        <input id="company" name="company" type="text" autocomplete="organization" required>
      </div>
      <div class="field">
        <label for="name">お名前</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="tel">電話番号</label>
        <input id="tel" name="tel" type="tel" autocomplete="tel" required>
      </div>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <!-- 備考は任意。書かなくても申し込めるようにする -->
      <div class="field">
        <label for="note">備考</label>
        <textarea id="note" name="note"></textarea>
      </div>
      <button class="btn submit" type="submit">この内容で資料請求する</button>
    </form>

    <p class="req-note">
      ボタンを押すと、入力内容が入った状態でメールソフトが開きます。<br>
      内容をご確認のうえ、そのまま送信してください。<br>
      開かない場合は <a href="mailto:RC@n-realize.co.jp">RC@n-realize.co.jp</a> までご連絡ください。
    </p>

    <a class="back" href="lp-star.html">← 前のページにもどる</a>
  </div>
</main>

<footer>
  <div class="wrap">
    <a class="footer-logo-link" href="https://n-realize.co.jp/" target="_blank" rel="noopener">
      <img class="footer-logo" src="logo-lmp.png" alt="ライフメイクパートナーズ"
           onerror="this.closest('.footer-logo-link').remove()">
    </a>
    <nav>
      <a href="lp-star.html">ホーム</a>
      <a href="kaisha-star.html">会社概要</a>
    </nav>
    <p class="footer-copy">© 日本リアライズ株式会社</p>
  </div>
</footer>

<!-- スマホ追従ボタン -->
<div class="sticky"><a class="btn" href="lp-star.html#entry">まず話を聞いてみる</a></div>

<script>
  // 入力内容からメール本文を組み立て、RC@n-realize.co.jp 宛でメーラーを開く（lp-star.html と同じ仕組み）
  document.getElementById('req-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = function (id) { return document.getElementById(id).value.trim(); };
    var required = [['company', '会社名'], ['name', 'お名前'], ['tel', '電話番号'], ['email', 'メールアドレス']];
    for (var i = 0; i < required.length; i++) {
      if (!v(required[i][0])) {
        alert(required[i][1] + 'をご入力ください。');
        document.getElementById(required[i][0]).focus();
        return;
      }
    }
    var body = [
      'ライフメイクパートナーズ 御中', '',
      '資料請求をお願いいたします。', '',
      '会社名：' + v('company'),
      'お名前：' + v('name'),
      '電話番号：' + v('tel'),
      'メールアドレス：' + v('email'),
      '備考：' + v('note'), ''
    ].join('\r\n');
    location.href = 'mailto:RC@n-realize.co.jp'
      + '?subject=' + encodeURIComponent('資料請求')
      + '&body=' + encodeURIComponent(body);
  });

  // 少しでもスクロールしたらヘッダーに下地の境界線を出す（lp-star.html と同じ）
  var hdr = document.getElementById('site-header');
  var onScroll = function () { hdr.classList.toggle('scrolled', window.scrollY > 8); };
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
</script>

</body>
</html>
