<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資料請求｜REALIZE CLUB</title>
<meta name="description" content="人生支援プラットフォーム REALIZE CLUB の導入資料請求はこちらから。">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* 配色・書体・ヘッダー/フッターは lp-rc.html と完全に揃えている。 */
  :root{
    --g:#0E3D2B;
    --gd:#06241A;
    --gm:#2C7A57;
    --gl:#C7DCD0;
    --ink:#111418;
    --gray:#76808C;
    --cream:#FBFAF6;
    --card:#FFFFFF;
    --r:16px;
    --hdr:56px;
  }
  @media (min-width:768px){ :root{ --hdr:68px } }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    font-size:16px;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    letter-spacing:.02em;
  }
  p{margin:0}
  img{max-width:100%;display:block}
  .wrap{width:min(100% - 40px,880px);margin-inline:auto}

  /* ── 固定ヘッダー（lp-rc.html と同じ） ── */
  .site-header{
    position:fixed;top:0;left:0;right:0;z-index:30;
    height:var(--hdr);
    background:var(--cream);
    border-bottom:1px solid transparent;
    transition:border-color .3s ease;
  }
  .site-header.scrolled{ border-bottom-color:var(--gl) }
  .site-header .wrap{
    height:100%;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .hdr-brand{
    display:flex;align-items:center;gap:8px;
    text-decoration:none;color:var(--g);
    font-family:"Noto Serif JP",serif;
    font-weight:700;font-size:17px;letter-spacing:.08em;
    white-space:nowrap;
  }
  .hdr-brand .dot{color:var(--gm)}

  .hdr-nav{display:flex;align-items:center;gap:22px}
  .hdr-nav a,.hdr-nav [aria-current]{
    color:var(--gray);text-decoration:none;
    font-size:14px;white-space:nowrap;
  }
  .hdr-nav [aria-current]{color:var(--g);font-weight:700}
  .hdr-nav a:hover{color:var(--g)}
  .hdr-cta{border-radius:10px;padding:9px 20px;background:var(--g);color:#fff !important}
  .hdr-cta:hover{background:var(--gd)}
  @media (max-width:900px){
    .hdr-nav{gap:14px}
    .hdr-nav a,.hdr-nav [aria-current]{font-size:13px}
    .hdr-cta{padding:8px 14px}
  }
  @media (max-width:767px){ .hdr-cta{display:none} }

  /* ── 本文 ── */
  main{padding:calc(var(--hdr) + 56px) 0 96px;text-align:center}
  @media (min-width:768px){ main{padding-top:calc(var(--hdr) + 92px)} }

  .page-tag{
    display:inline-block;
    background:var(--g);
    color:#fff;
    font-family:"Noto Serif JP",serif;
    font-weight:700;
    font-size:clamp(18px,4.6vw,26px);
    letter-spacing:.16em;
    padding:14px 44px;
    border-radius:999px;
    box-shadow:0 6px 16px rgba(14,61,43,.18);
    margin-bottom:22px;
  }
  .lead{color:var(--gray);font-size:15px;margin-bottom:14px}
  .desc{
    max-width:520px;margin:0 auto 44px;
    color:var(--gray);font-size:14px;line-height:1.9;
  }

  /* ── フォーム（lp-rc.html の最終CTAと同じ作り） ── */
  form{
    max-width:520px;
    margin-inline:auto;
    text-align:left;
    background:var(--card);
    border:1px solid var(--gl);
    border-radius:var(--r);
    padding:32px 24px;
  }
  .field{margin-bottom:20px}
  label{display:block;font-size:14px;margin-bottom:8px;color:var(--gray)}
  input,textarea{
    width:100%;
    padding:15px 16px;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--gl);
    border-radius:12px;
  }
  textarea{min-height:96px;resize:vertical;line-height:1.7;display:block}
  input:focus,textarea:focus{outline:2px solid var(--g);outline-offset:1px;border-color:transparent}
  .btn{
    display:block;width:100%;
    background:var(--g);
    color:#fff;
    text-align:center;
    text-decoration:none;
    font-weight:700;
    font-size:17px;
    font-family:inherit;
    padding:20px;
    margin-top:8px;
    border:0;
    border-radius:var(--r);
    cursor:pointer;
    transition:background .25s ease;
  }
  .btn:hover{background:var(--gd)}
  .req-note{
    max-width:520px;margin:24px auto 0;
    font-size:13px;line-height:1.9;color:var(--gray);
  }
  .req-note a{color:var(--g)}

  .back{
    display:inline-block;margin-top:44px;
    color:var(--gray);text-decoration:none;font-size:14px;
  }
  .back:hover{color:var(--g);text-decoration:underline}

  /* ── フッター（lp-rc.html と同じ） ── */
  footer{
    padding:48px 0 40px;
    text-align:center;
    font-size:13px;
    color:var(--gray);
    border-top:1px solid var(--gl);
  }
  footer a{color:var(--gray);text-decoration:none;margin:0 12px}
  footer a:hover{color:var(--g)}
  .footer-brand{font-family:"Noto Serif JP",serif;font-weight:700;color:var(--g);font-size:16px;margin-bottom:14px}
  .footer-copy{margin-top:14px;font-size:12px}

  /* ── スマホ追従ボタン ── */
  .sticky{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(251,250,246,.94);
    backdrop-filter:blur(6px);
    border-top:1px solid var(--gl);
  }
  .sticky .btn{padding:14px;font-size:15px;border-radius:12px}
  @media (min-width:768px){ .sticky{display:none} }
  @media (max-width:767px){ body{padding-bottom:64px} }
</style>
</head>
<body>

<!-- 固定ヘッダー -->
<div class="site-header" id="site-header">
  <div class="wrap">
    <a class="hdr-brand" href="lp-rc.html">REALIZE CLUB<span class="dot">.</span></a>
    <nav class="hdr-nav">
      <a href="lp-rc.html">ホーム</a>
      <a href="kaisha-rc.html">会社概要</a>
      <a class="hdr-cta" href="lp-rc.html#entry">導入を相談する</a>
      <!-- 今このページなので、資料請求はリンクにせず現在地として見せる -->
      <span aria-current="page">資料請求</span>
    </nav>
  </div>
</div>

<main>
  <div class="wrap">
    <p class="page-tag">資料請求</p>
    <p class="lead">REALIZE CLUB導入の概要をまとめた資料をお送りします。</p>
    <p class="desc">
      仕組みと導入の流れ、企業が得られる効果をまとめた資料をお届けします。<br>
      届いてすぐのご契約や、しつこいご連絡はいたしません。
    </p>

    <!--
      送信先はメール（RC@n-realize.co.jp）。サーバー側の受け口が無いため、
      入力内容から本文を組み立ててメーラーを開く方式（lp-rc.html と同じ）。
      lp-rc.html の「導入を相談する」フォームと同じ5項目（備考を含む）で揃える。
    -->
    <form id="req-form" novalidate>
      <div class="field">
        <label for="company">会社名</label>
        <input id="company" name="company" type="text" autocomplete="organization" required>
      </div>
      <div class="field">
        <label for="name">ご担当者名</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="tel">電話番号</label>
        <input id="tel" name="tel" type="tel" autocomplete="tel" required>
      </div>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="note">備考</label>
        <textarea id="note" name="note"></textarea>
      </div>
      <button class="btn submit" type="submit">この内容で資料請求する</button>
    </form>

    <p class="req-note">
      ボタンを押すと、入力内容が入った状態でメールソフトが開きます。<br>
      内容をご確認のうえ、そのまま送信してください。<br>
      開かない場合は <a href="mailto:RC@n-realize.co.jp">RC@n-realize.co.jp</a> までご連絡ください。
    </p>

    <a class="back" href="lp-rc.html">← 前のページにもどる</a>
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="footer-brand">REALIZE CLUB</p>
    <nav>
      <a href="lp-rc.html">ホーム</a>
      <a href="kaisha-rc.html">会社概要</a>
    </nav>
    <p class="footer-copy">© 株式会社REALIZE OS</p>
  </div>
</footer>

<!-- スマホ追従ボタン -->
<div class="sticky"><a class="btn" href="lp-rc.html#entry">導入を相談する</a></div>

<script>
  // 入力内容からメール本文を組み立て、RC@n-realize.co.jp 宛でメーラーを開く（lp-rc.html と同じ仕組み）
  document.getElementById('req-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = function (id) { return document.getElementById(id).value.trim(); };
    var required = [['company', '会社名'], ['name', 'ご担当者名'], ['tel', '電話番号'], ['email', 'メールアドレス']];
    for (var i = 0; i < required.length; i++) {
      if (!v(required[i][0])) {
        alert(required[i][1] + 'をご入力ください。');
        document.getElementById(required[i][0]).focus();
        return;
      }
    }
    var body = [
      'REALIZE CLUB 御中', '',
      '資料請求をお願いいたします。', '',
      '会社名：' + v('company'),
      'ご担当者名：' + v('name'),
      '電話番号：' + v('tel'),
      'メールアドレス：' + v('email'),
      '備考：' + v('note'), ''
    ].join('\r\n');
    location.href = 'mailto:RC@n-realize.co.jp'
      + '?subject=' + encodeURIComponent('資料請求（REALIZE CLUB）')
      + '&body=' + encodeURIComponent(body);
  });

  // 少しでもスクロールしたらヘッダーに下地の境界線を出す（lp-rc.html と同じ）
  var hdr = document.getElementById('site-header');
  var onScroll = function () { hdr.classList.toggle('scrolled', window.scrollY > 8); };
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
</script>

</body>
</html>
