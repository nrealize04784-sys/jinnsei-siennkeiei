<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会社概要｜REALIZE CLUB</title>
<meta name="description" content="人生支援プラットフォーム REALIZE CLUB の運営会社、株式会社REALIZE OSの会社概要。">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* 配色・書体・ヘッダー/フッターは lp-rc.html と完全に揃えている。 */
  :root{
    --g:#0E3D2B;
    --gd:#06241A;
    --gm:#2C7A57;
    --gl:#C7DCD0;
    --ink:#111418;
    --gray:#76808C;
    --cream:#FBFAF6;
    --card:#FFFFFF;
    --r:16px;
    --hdr:56px;
  }
  @media (min-width:768px){ :root{ --hdr:68px } }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    font-size:16px;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    letter-spacing:.02em;
  }
  p{margin:0}
  img{max-width:100%;display:block}
  .wrap{width:min(100% - 40px,880px);margin-inline:auto}

  /* ── 固定ヘッダー（lp-rc.html と同じ） ── */
  .site-header{
    position:fixed;top:0;left:0;right:0;z-index:30;
    height:var(--hdr);
    background:var(--cream);
    border-bottom:1px solid transparent;
    transition:border-color .3s ease;
  }
  .site-header.scrolled{ border-bottom-color:var(--gl) }
  .site-header .wrap{
    height:100%;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .hdr-brand{
    display:flex;align-items:center;gap:8px;
    text-decoration:none;color:var(--g);
    font-family:"Noto Serif JP",serif;
    font-weight:700;font-size:17px;letter-spacing:.08em;
    white-space:nowrap;
  }
  .hdr-brand .dot{color:var(--gm)}

  .hdr-nav{display:flex;align-items:center;gap:22px}
  .hdr-nav a,.hdr-nav [aria-current]{
    color:var(--gray);text-decoration:none;
    font-size:14px;white-space:nowrap;
  }
  .hdr-nav [aria-current]{color:var(--g);font-weight:700}
  .hdr-nav a:hover{color:var(--g)}
  .hdr-cta,.hdr-cta2{border-radius:10px;padding:9px 20px}
  .hdr-cta{background:var(--g);color:#fff !important}
  .hdr-cta:hover{background:var(--gd)}
  .hdr-cta2{background:transparent;border:1px solid var(--g);color:var(--g) !important}
  .hdr-cta2:hover{background:#EAF2ED}
  @media (max-width:900px){
    .hdr-nav{gap:14px}
    .hdr-nav a,.hdr-nav [aria-current]{font-size:13px}
    .hdr-cta,.hdr-cta2{padding:8px 14px}
  }
  @media (max-width:767px){ .hdr-cta,.hdr-cta2{display:none} }

  /* ── 本文 ── */
  main{padding:calc(var(--hdr) + 56px) 0 96px;text-align:center}
  @media (min-width:768px){ main{padding-top:calc(var(--hdr) + 92px)} }

  .page-tag{
    display:inline-block;
    background:var(--g);
    color:#fff;
    font-family:"Noto Serif JP",serif;
    font-weight:700;
    font-size:clamp(18px,4.6vw,26px);
    letter-spacing:.16em;
    padding:14px 44px;
    border-radius:999px;
    box-shadow:0 6px 16px rgba(14,61,43,.18);
    margin-bottom:22px;
  }
  .lead{color:var(--gray);font-size:15px;margin-bottom:48px}

  dl.kaisha-table{
    max-width:640px;margin:0 auto;text-align:left;
    display:grid;grid-template-columns:130px 1fr;
    background:var(--card);
    border-radius:var(--r);
    padding:8px 28px;
    box-shadow:0 4px 22px rgba(14,61,43,.08);
  }
  dl.kaisha-table dt,dl.kaisha-table dd{
    padding:15px 6px;font-size:15px;line-height:1.9;margin:0;
    border-bottom:1px solid var(--gl);
  }
  dl.kaisha-table dt:nth-last-of-type(1),
  dl.kaisha-table dd:nth-last-of-type(1){border-bottom:0}
  dl.kaisha-table dt{color:var(--gray);letter-spacing:.06em}
  dl.kaisha-table dd{color:var(--ink)}
  dl.kaisha-table dd a{color:var(--g);text-decoration:none}
  dl.kaisha-table dd a:hover{text-decoration:underline}
  @media (max-width:600px){
    dl.kaisha-table{grid-template-columns:1fr;padding:6px 22px}
    dl.kaisha-table dt{padding-bottom:0;border-bottom:0}
    dl.kaisha-table dd{padding-top:2px}
  }

  .back{
    display:inline-block;margin-top:48px;
    color:var(--gray);text-decoration:none;font-size:14px;
  }
  .back:hover{color:var(--g);text-decoration:underline}

  /* ── フッター（lp-rc.html と同じ） ── */
  footer{
    padding:48px 0 40px;
    text-align:center;
    font-size:13px;
    color:var(--gray);
    border-top:1px solid var(--gl);
  }
  footer a{color:var(--gray);text-decoration:none;margin:0 12px}
  footer a:hover{color:var(--g)}
  .footer-brand{font-family:"Noto Serif JP",serif;font-weight:700;color:var(--g);font-size:16px;margin-bottom:14px}
  .footer-copy{margin-top:14px;font-size:12px}

  /* ── スマホ追従ボタン ── */
  .sticky{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(251,250,246,.94);
    backdrop-filter:blur(6px);
    border-top:1px solid var(--gl);
  }
  .sticky .btn{
    display:block;text-align:center;padding:14px;font-size:15px;border-radius:12px;
    background:var(--g);color:#fff;text-decoration:none;font-weight:700;
  }
  .sticky .btn:hover{background:var(--gd)}
  @media (min-width:768px){ .sticky{display:none} }
  @media (max-width:767px){ body{padding-bottom:64px} }
</style>
</head>
<body>

<!-- 固定ヘッダー -->
<div class="site-header" id="site-header">
  <div class="wrap">
    <a class="hdr-brand" href="lp-rc.html">REALIZE CLUB<span class="dot">.</span></a>
    <nav class="hdr-nav">
      <a href="lp-rc.html">ホーム</a>
      <!-- 今このページなので、会社概要はリンクにせず現在地として見せる -->
      <span aria-current="page">会社概要</span>
      <a class="hdr-cta" href="lp-rc.html#entry">導入を相談する</a>
      <a class="hdr-cta2" href="shiryou-rc.html">資料請求</a>
    </nav>
  </div>
</div>

<main>
  <div class="wrap">
    <p class="page-tag">会社概要</p>
    <p class="lead">REALIZE CLUBの運営会社です。</p>
    <dl class="kaisha-table">
      <dt>商号</dt><dd>株式会社REALIZE OS</dd>
      <dt>所在地</dt><dd>東京都新宿区新宿1丁目36番7号　新宿内野ビルII 8F</dd>
      <dt>電話番号</dt><dd><a href="tel:0363805978">03-6380-5978</a>（代表）</dd>
      <dt>FAX</dt><dd>03-6380-5972</dd>
      <dt>事業内容</dt><dd>人生支援プラットフォーム「REALIZE CLUB」の企画・運営</dd>
    </dl>
    <a class="back" href="lp-rc.html">← 前のページにもどる</a>
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="footer-brand">REALIZE CLUB</p>
    <nav>
      <a href="lp-rc.html">ホーム</a>
      <a href="shiryou-rc.html">資料請求</a>
    </nav>
    <p class="footer-copy">© 株式会社REALIZE OS</p>
  </div>
</footer>

<!-- スマホ追従ボタン -->
<div class="sticky"><a class="btn" href="lp-rc.html#entry">導入を相談する</a></div>

<script>
  // 少しでもスクロールしたらヘッダーに下地の境界線を出す（lp-rc.html と同じ）
  var hdr = document.getElementById('site-header');
  var onScroll = function () { hdr.classList.toggle('scrolled', window.scrollY > 8); };
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
</script>

</body>
</html>
