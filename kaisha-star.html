<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会社概要｜ライフメイクパートナーズ</title>
<meta name="description" content="ライフメイクパートナーズ（日本リアライズ株式会社）の会社概要。">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* 配色・書体・ヘッダー/フッターは lp-star.html と完全に揃えている。 */
  :root{
    --bg2:#F5D343;       /* ヘッダーの地。lp-star.html のファーストビューと同じマスタード */
    --cream:#FBF3DD;
    --ink:#1B2A4A;
    --ink-soft:#4A5A78;
    --yellow:#F5C400;
    --yellow-deep:#A67B00;
    --red:#E2352B;
    --red-deep:#B8221B;
    --line:rgba(27,42,74,.14);
    --card:#FFFFFF;
    --r:16px;
    --hdr:56px;
  }
  @media (min-width:768px){ :root{ --hdr:68px } }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
    font-size:16px;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    letter-spacing:.02em;
  }
  p{margin:0}
  img{max-width:100%;display:block}
  .wrap{width:min(100% - 40px,880px);margin-inline:auto}

  /* ── 固定ヘッダー（lp-star.html と同じ） ── */
  .site-header{
    position:fixed;top:0;left:0;right:0;z-index:30;
    height:var(--hdr);
    background:var(--bg2);
    border-bottom:1px solid transparent;
    transition:background .3s ease,border-color .3s ease;
  }
  .site-header.scrolled{ border-bottom-color:var(--line) }
  .site-header .wrap{
    height:100%;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .hdr-brand{
    display:flex;align-items:center;gap:10px;
    text-decoration:none;color:var(--ink);
    font-weight:700;font-size:14px;letter-spacing:.06em;
    white-space:nowrap;
  }
  .hdr-lockup{display:flex;align-items:center;gap:8px}
  .hdr-logo,.hdr-word{width:auto;object-fit:contain;mix-blend-mode:multiply}
  .hdr-logo{height:32px}
  .hdr-word{height:13px}
  @media (min-width:768px){ .hdr-logo{height:38px} .hdr-word{height:15px} }
  @media (max-width:520px){ .hdr-word{display:none} }

  .hdr-nav{display:flex;align-items:center;gap:22px}
  .hdr-nav a,.hdr-nav [aria-current]{
    color:var(--ink-soft);text-decoration:none;
    font-size:14px;white-space:nowrap;
  }
  .hdr-nav [aria-current]{color:var(--ink);font-weight:700}
  .hdr-nav a:hover{color:var(--ink)}
  .hdr-cta{border-radius:10px;padding:9px 20px;background:var(--red);color:#fff !important}
  .hdr-cta:hover{background:var(--red-deep)}
  /* 資料請求は白抜き。赤い友だち追加より一段控えめに見せる */
  .hdr-cta2{background:var(--card) !important;border:1px solid var(--red);color:var(--red) !important}
  .hdr-cta2:hover{background:var(--red) !important;color:#fff !important}
  @media (max-width:900px){
    .hdr-nav{gap:14px}
    .hdr-nav a,.hdr-nav [aria-current]{font-size:13px}
    .hdr-cta{padding:8px 14px}
  }
  @media (max-width:767px){ .hdr-cta{display:none} }

  /* ── 本文 ── */
  main{padding:calc(var(--hdr) + 56px) 0 96px;text-align:center}
  @media (min-width:768px){ main{padding-top:calc(var(--hdr) + 92px)} }

  /* 見出しの札。lp-star.html のリボン札（ようこそ、この輪へ。）と同じ横組みの帯 */
  .page-tag{
    display:inline-block;
    background:var(--yellow);
    color:var(--ink);
    font-weight:700;
    font-size:clamp(18px,4.6vw,26px);
    letter-spacing:.16em;
    padding:14px 44px;
    clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%);
    box-shadow:0 6px 16px rgba(74,59,18,.14);
    margin-bottom:22px;
  }
  .lead{color:var(--ink-soft);font-size:15px;margin-bottom:48px}

  /* ── 会社情報。lp-star.html のカード（白地・淡い影）と同じ質感 ── */
  dl.kaisha-table{
    max-width:640px;margin:0 auto;text-align:left;
    display:grid;grid-template-columns:130px 1fr;
    background:var(--card);
    border-radius:var(--r);
    padding:8px 28px;
    box-shadow:0 4px 22px rgba(120,100,40,.08);
  }
  dl.kaisha-table dt,dl.kaisha-table dd{
    padding:15px 6px;font-size:15px;line-height:1.9;margin:0;
    border-bottom:1px solid var(--line);
  }
  dl.kaisha-table dt:nth-last-of-type(1),
  dl.kaisha-table dd:nth-last-of-type(1){border-bottom:0}
  dl.kaisha-table dt{color:var(--ink-soft);letter-spacing:.06em}
  dl.kaisha-table dd{color:var(--ink)}
  dl.kaisha-table dd a{color:var(--ink);text-decoration:none}
  dl.kaisha-table dd a:hover{text-decoration:underline}
  @media (max-width:600px){
    dl.kaisha-table{grid-template-columns:1fr;padding:6px 22px}
    dl.kaisha-table dt{padding-bottom:0;border-bottom:0}
    dl.kaisha-table dd{padding-top:2px}
  }

  .back{
    display:inline-block;margin-top:48px;
    color:var(--ink-soft);text-decoration:none;font-size:14px;
  }
  .back:hover{color:var(--ink);text-decoration:underline}

  /* ── フッター（lp-star.html と同じ） ── */
  footer{
    padding:48px 0 40px;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
  footer a{color:var(--ink-soft);text-decoration:none;margin:0 12px}
  footer a:hover{color:var(--ink)}
  .footer-logo-link{display:inline-block;margin:0 0 22px}
  .footer-logo{width:min(220px,54vw);height:auto;mix-blend-mode:multiply}
  .footer-copy{margin-top:14px;font-size:12px}

  /* ── スマホ追従ボタン（lp-star.html と同じ、控えめな1本） ── */
  .sticky{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(245,211,67,.94);
    backdrop-filter:blur(6px);
    border-top:1px solid var(--line);
  }
  .sticky .btn{
    display:block;text-align:center;padding:14px;font-size:15px;border-radius:12px;
    background:var(--red);color:#fff;text-decoration:none;font-weight:700;
  }
  .sticky .btn:hover{background:var(--red-deep)}
  @media (min-width:768px){ .sticky{display:none} }
  @media (max-width:767px){ body{padding-bottom:64px} }
</style>
</head>
<body>

<!-- 固定ヘッダー -->
<div class="site-header" id="site-header">
  <div class="wrap">
    <a class="hdr-brand" href="lp-star.html">
      <span class="hdr-lockup">
        <img class="hdr-logo" src="logo-lmp.png" alt="ライフメイクパートナーズ"
             onerror="this.closest('.hdr-lockup').remove()">
        <img class="hdr-word" src="logo-lmp-wordmark.png" alt="">
      </span>
    </a>
    <nav class="hdr-nav">
      <a href="lp-star.html">ホーム</a>
      <!-- 今このページなので、会社概要はリンクにせず現在地として見せる -->
      <span aria-current="page">会社概要</span>
      <a class="hdr-cta btn" href="https://lin.ee/WHYApuM" target="_blank" rel="noopener">LINEで友だちになる</a>
      <a class="hdr-cta btn hdr-cta2" href="https://line.me/R/oaMessage/%40179gucaj/?%E8%B3%87%E6%96%99%E8%AB%8B%E6%B1%82" target="_blank" rel="noopener">資料請求をする</a>
    </nav>
  </div>
</div>

<main>
  <div class="wrap">
    <p class="page-tag">会社概要</p>
    <p class="lead">ライフメイクパートナーズの運営会社です。</p>
    <dl class="kaisha-table">
      <dt>商号</dt><dd>日本リアライズ株式会社</dd>
      <dt>設立</dt><dd>2009年1月20日</dd>
      <dt>代表者</dt><dd>代表取締役　大橋 孝行</dd>
      <dt>所在地</dt><dd>東京都新宿区新宿1丁目36番7号　新宿内野ビルII 3F、8F</dd>
      <dt>電話番号</dt><dd><a href="tel:0363805978">03-6380-5978</a>（代表）</dd>
    </dl>
    <a class="back" href="lp-star.html">← 前のページにもどる</a>
  </div>
</main>

<footer>
  <div class="wrap">
    <a class="footer-logo-link" href="https://n-realize.co.jp/" target="_blank" rel="noopener">
      <img class="footer-logo" src="logo-lmp.png" alt="ライフメイクパートナーズ"
           onerror="this.closest('.footer-logo-link').remove()">
    </a>
    <nav>
      <a href="lp-star.html">ホーム</a>
    </nav>
    <p class="footer-copy">© 日本リアライズ株式会社</p>
  </div>
</footer>

<!-- スマホ追従ボタン -->
<div class="sticky"><a class="btn" href="https://lin.ee/WHYApuM" target="_blank" rel="noopener">LINEで友だちになる</a></div>

<script>
  // 少しでもスクロールしたらヘッダーに下地の境界線を出す（lp-star.html と同じ）
  var hdr = document.getElementById('site-header');
  var onScroll = function () { hdr.classList.toggle('scrolled', window.scrollY > 8); };
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
</script>

</body>
</html>
