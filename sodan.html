<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>導入相談｜REALIZE CLUB</title>
<meta name="description" content="資料を読む前に、直接お話しください。REALIZE CLUBの導入相談窓口です。">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* 配色・書体・パーツは lp-realize-club.html と揃えている */
  :root{
    --bg:#0E0908;
    --bg-deep:#0A0605;
    --card:#1B1310;
    --card-line:rgba(243,237,228,.10);
    --ink:#F3EDE4;
    --ink-soft:rgba(243,237,228,.66);
    --ink-faint:rgba(243,237,228,.42);
    --red:#C6281D;
    --orange:#F2703C;
    --gold:#F2A93C;
    --gold-line:#E8B64C;
    --flame:linear-gradient(90deg,var(--red),var(--orange) 55%,var(--gold));
    --r:10px;
    --hdr:60px;
  }
  @media (min-width:768px){ :root{ --hdr:72px } }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    font-size:16px;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    letter-spacing:.02em;
  }
  h1{font-weight:900;line-height:1.5;letter-spacing:.01em;margin:0;text-wrap:balance}
  p{margin:0}

  .wrap{width:min(100% - 40px,880px);margin-inline:auto}

  .btn{
    display:inline-block;
    background:var(--flame);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:16px;
    padding:18px 38px;
    border-radius:var(--r);
    border:0;
    cursor:pointer;
    font-family:inherit;
    box-shadow:0 8px 26px rgba(198,40,29,.34);
    transition:filter .25s ease,box-shadow .25s ease;
  }
  .btn:hover{filter:brightness(1.08);box-shadow:0 10px 30px rgba(198,40,29,.44)}

  /* ── 固定ヘッダー ── */
  .site-header{
    position:fixed;top:0;left:0;right:0;z-index:30;
    height:var(--hdr);
    background:rgba(14,9,8,.86);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--card-line);
  }
  .site-header .wrap{
    height:100%;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .hdr-brand{
    display:flex;align-items:center;gap:9px;
    text-decoration:none;color:var(--ink);
    font-weight:900;font-size:16px;letter-spacing:.08em;
    white-space:nowrap;
  }
  .hdr-flame{width:22px;height:22px;flex:none;display:block;filter:drop-shadow(0 0 6px rgba(242,112,60,.65))}
  .hdr-nav{display:flex;align-items:center;gap:22px}
  .hdr-nav a{color:var(--ink-soft);text-decoration:none;font-size:14px;white-space:nowrap}
  .hdr-nav a:hover{color:var(--gold-line)}
  .hdr-cta{border-radius:9px;padding:9px 20px;color:#fff !important;font-size:14px}
  @media (max-width:600px){ .hdr-nav a:not(.hdr-cta){display:none} }

  /* ── 本文 ── */
  main{padding:calc(var(--hdr) + 56px) 0 96px}
  @media (min-width:768px){ main{padding-top:calc(var(--hdr) + 88px)} }
  h1{font-size:clamp(26px,5vw,38px);text-align:center;margin-bottom:14px}
  .lead{text-align:center;color:var(--ink-soft);font-size:16px;margin-bottom:48px}

  form{
    max-width:520px;
    margin-inline:auto;
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:var(--r);
    padding:32px 24px;
  }
  .field{margin-bottom:20px}
  label{display:block;font-size:14px;margin-bottom:8px;color:var(--ink-soft)}
  input,textarea{
    width:100%;
    padding:15px 16px;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    background:#141010;
    border:1px solid var(--card-line);
    border-radius:8px;
  }
  textarea{min-height:96px;resize:vertical;line-height:1.7}
  input:focus,textarea:focus{outline:2px solid var(--gold-line);outline-offset:1px;border-color:transparent}
  input::placeholder,textarea::placeholder{color:var(--ink-faint)}
  .submit{width:100%;margin-top:8px;font-size:17px;padding:20px}
  .entry-note{
    max-width:520px;
    margin:24px auto 0;
    font-size:13px;
    line-height:1.9;
    color:var(--ink-faint);
    text-align:center;
  }
  .entry-note a{color:var(--gold-line)}
  .back{
    display:block;text-align:center;margin-top:44px;
    color:var(--ink-faint);font-size:14px;text-decoration:none;
  }
  .back:hover{color:var(--gold-line)}

  /* ── フッター ── */
  footer{
    padding:48px 0 40px;
    text-align:center;
    font-size:13px;
    color:var(--ink-faint);
    border-top:1px solid var(--card-line);
    background:var(--bg-deep);
  }
  footer .brand{
    display:inline-flex;align-items:center;gap:8px;
    font-weight:900;color:var(--ink-soft);font-size:15px;letter-spacing:.08em;
    margin-bottom:18px;
  }
  footer nav a{color:var(--ink-faint);text-decoration:none;margin:0 12px}
  footer nav a:hover{color:var(--gold-line)}
  footer .addr{margin-top:16px;line-height:1.8}
  .footer-copy{margin-top:14px;font-size:12px}
</style>
</head>
<body>

<svg class="icon-sprite" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
<defs>
  <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" style="stop-color:var(--red)"/>
    <stop offset="55%" style="stop-color:var(--orange)"/>
    <stop offset="100%" style="stop-color:var(--gold)"/>
  </linearGradient>
  <path id="flameIcon" fill="url(#flameGrad)"
    d="M12 1.2c-.6 3.2-2.6 5-4.4 7.2C5.8 10.7 4.6 13 4.6 15.6 4.6 20.2 7.9 23 12 23s7.4-2.8 7.4-7.4c0-2.6-1.3-4.7-2.7-6.3-.2 2.1-1.2 3.5-2.5 3.5-1.2 0-1.9-1-1.6-2.3.4-1.7 1-3.3-.6-9.3z"/>
</defs>
</svg>

<div class="site-header">
  <div class="wrap">
    <a class="hdr-brand" href="lp-realize-club.html#top">
      <svg class="hdr-flame" viewBox="0 0 24 24" aria-hidden="true"><use href="#flameIcon"/></svg>
      REALIZE CLUB
    </a>
    <nav class="hdr-nav">
      <a href="lp-realize-club.html#top">ホーム</a>
      <a class="hdr-cta btn" href="shiryou-realize.html">資料請求</a>
    </nav>
  </div>
</div>

<main>
  <div class="wrap">
    <h1>導入相談</h1>
    <p class="lead">資料を読む前に、直接お話しさせてください。折り返しご連絡します。</p>

    <!--
      送信先はメール（RC@n-realize.co.jp）。サーバー側の受け口が無いため、
      入力内容から本文を組み立ててメーラーを開く方式（lp-realize-club.html と同じ）。
    -->
    <form id="sodan-form" novalidate>
      <div class="field">
        <label for="company">会社名</label>
        <input id="company" name="company" type="text" autocomplete="organization" required>
      </div>
      <div class="field">
        <label for="name">お名前</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="tel">電話番号</label>
        <input id="tel" name="tel" type="tel" autocomplete="tel" required>
      </div>
      <div class="field">
        <label for="time">ご都合の良い時間帯</label>
        <input id="time" name="time" type="text" placeholder="例：平日15時以降">
      </div>
      <div class="field">
        <label for="memo">相談したいこと（任意）</label>
        <textarea id="memo" name="memo"></textarea>
      </div>
      <button class="btn submit" type="submit">この内容で相談を申し込む</button>
    </form>
    <p class="entry-note">
      ボタンを押すと、入力内容が入った状態でメールソフトが開きます。<br>
      内容をご確認のうえ、そのまま送信してください。<br>
      開かない場合は <a href="mailto:RC@n-realize.co.jp">RC@n-realize.co.jp</a> までご連絡ください。
    </p>

    <a class="back" id="back-link" href="lp-realize-club.html">← 前のページにもどる</a>
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="brand"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;flex:none"><use href="#flameIcon"/></svg>REALIZE CLUB</p>
    <nav>
      <a href="kaisha.html">会社概要</a>
      <a href="shiryou-realize.html">資料請求</a>
    </nav>
    <p class="addr">日本リアライズ株式会社<br>東京都新宿区新宿1丁目36番7号　新宿内野ビルII 8F　TEL：03-6380-5978</p>
    <p class="footer-copy">© 日本リアライズ株式会社</p>
  </div>
</footer>

<script>
  document.getElementById('sodan-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = function (id) { return document.getElementById(id).value.trim(); };
    var required = [['company', '会社名'], ['name', 'お名前'], ['tel', '電話番号']];
    for (var i = 0; i < required.length; i++) {
      if (!v(required[i][0])) {
        alert(required[i][1] + 'をご入力ください。');
        document.getElementById(required[i][0]).focus();
        return;
      }
    }
    var body = [
      'REALIZE CLUB 御中', '',
      '導入相談を希望します。', '',
      '会社名：' + v('company'),
      'お名前：' + v('name'),
      '電話番号：' + v('tel'),
      'ご都合の良い時間帯：' + v('time'),
      '相談したいこと：' + v('memo'), ''
    ].join('\r\n');
    location.href = 'mailto:RC@n-realize.co.jp'
      + '?subject=' + encodeURIComponent('導入相談')
      + '&body=' + encodeURIComponent(body);
  });

  document.getElementById('back-link').addEventListener('click', function (e) {
    var sameSite = false;
    try {
      sameSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
    } catch (err) { sameSite = false; }
    if (sameSite) {
      e.preventDefault();
      history.back();
    }
  });
</script>

</body>
</html>
