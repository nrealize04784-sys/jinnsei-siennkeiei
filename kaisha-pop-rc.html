<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会社概要｜REALIZE CLUB</title>
<meta name="description" content="REALIZE CLUB（日本リアライズ株式会社）の会社概要。">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* 配色・書体・ヘッダー/フッターは lp-pop-rc.html と揃えている。 */
  :root{
    --bg:#FFFFFF;
    --cream:#FFFBEA;
    --yellow:#FFD400;
    --yellow-deep:#8A6A00;
    --red:#E2352B;
    --red-deep:#B8221B;
    --ink:#1A1A1A;
    --ink-soft:#5A564A;
    --line:rgba(26,26,26,.14);
    --card:#FFFFFF;
    --r:16px;
    --hdr:56px;
    --font-pop:"Yusei Magic","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  }
  @media (min-width:768px){ :root{ --hdr:68px } }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
    font-size:16px;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    letter-spacing:.02em;
  }
  p{margin:0}
  img{max-width:100%;display:block}
  .wrap{width:min(100% - 40px,880px);margin-inline:auto}

  /* ── 固定ヘッダー（lp-pop-rc.html と同じ） ── */
  .site-header{
    position:fixed;top:0;left:0;right:0;z-index:30;
    height:var(--hdr);
    background:#fff;
    border-bottom:1px solid transparent;
    transition:border-color .3s ease;
  }
  .site-header.scrolled{ border-bottom-color:var(--line) }
  .site-header .wrap{ height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px }
  .hdr-brand{
    font-family:var(--font-pop);
    text-decoration:none;color:var(--ink);
    font-size:clamp(13px,3.4vw,17px);
    white-space:nowrap;
  }
  .hdr-brand span{color:var(--red)}
  .hdr-nav{display:flex;align-items:center;gap:22px}
  .hdr-nav a,.hdr-nav [aria-current]{ color:var(--ink-soft);text-decoration:none;font-size:14px;white-space:nowrap }
  .hdr-nav [aria-current]{color:var(--ink);font-weight:700}
  .hdr-nav a:hover{color:var(--red)}
  .hdr-cta{border-radius:10px;padding:9px 20px;background:var(--red);color:#fff !important}
  .hdr-cta:hover{background:var(--red-deep)}
  @media (max-width:900px){ .hdr-nav{gap:12px} .hdr-nav a,.hdr-nav [aria-current]{font-size:12.5px} .hdr-cta{padding:8px 13px} }
  @media (max-width:600px){ .hdr-nav a:not(.hdr-cta):not([aria-current]){display:none} }
  @media (max-width:767px){ .hdr-cta{display:none} }

  /* ── 本文 ── */
  main{padding:calc(var(--hdr) + 56px) 0 96px;text-align:center}
  @media (min-width:768px){ main{padding-top:calc(var(--hdr) + 92px)} }

  .page-tag{
    display:inline-block;
    background:var(--yellow);
    color:var(--ink);
    font-weight:700;
    font-size:clamp(18px,4.6vw,26px);
    letter-spacing:.12em;
    padding:14px 44px;
    clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%);
    transform:rotate(-1.5deg);
    margin-bottom:22px;
  }
  .lead{color:var(--ink-soft);font-size:15px;margin-bottom:48px}

  dl.kaisha-table{
    max-width:640px;margin:0 auto;text-align:left;
    display:grid;grid-template-columns:130px 1fr;
    background:var(--card);
    border:2px solid var(--yellow);
    border-radius:var(--r);
    padding:8px 28px;
    box-shadow:0 4px 22px rgba(26,26,26,.08);
  }
  dl.kaisha-table dt,dl.kaisha-table dd{
    padding:15px 6px;font-size:15px;line-height:1.9;margin:0;
    border-bottom:1px solid var(--line);
  }
  dl.kaisha-table dt:nth-last-of-type(1),
  dl.kaisha-table dd:nth-last-of-type(1){border-bottom:0}
  dl.kaisha-table dt{color:var(--ink-soft);letter-spacing:.06em}
  dl.kaisha-table dd{color:var(--ink)}
  dl.kaisha-table dd a{color:var(--red-deep);text-decoration:none}
  dl.kaisha-table dd a:hover{text-decoration:underline}
  @media (max-width:600px){
    dl.kaisha-table{grid-template-columns:1fr;padding:6px 22px}
    dl.kaisha-table dt{padding-bottom:0;border-bottom:0}
    dl.kaisha-table dd{padding-top:2px}
  }

  .back{
    display:inline-block;margin-top:48px;
    color:var(--ink-soft);text-decoration:none;font-size:14px;
  }
  .back:hover{color:var(--red-deep);text-decoration:underline}

  /* ── フッター ── */
  footer{ padding:48px 0 40px;text-align:center;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--line) }
  footer a{color:var(--ink-soft);text-decoration:none;margin:0 12px}
  footer a:hover{color:var(--red-deep)}
  .footer-brand{
    display:inline-block;margin:0 0 18px;
    font-family:var(--font-pop);font-size:20px;color:var(--ink);
  }
  .footer-brand span{color:var(--red)}
  .footer-copy{margin-top:14px;font-size:12px}

  /* ── スマホ追従ボタン ── */
  .sticky{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,212,0,.94);
    backdrop-filter:blur(6px);
    border-top:1px solid var(--line);
  }
  .sticky .btn{
    display:block;text-align:center;padding:14px;font-size:15px;border-radius:12px;
    background:var(--red);color:#fff;text-decoration:none;font-weight:700;
  }
  .sticky .btn:hover{background:var(--red-deep)}
  @media (min-width:768px){ .sticky{display:none} }
  @media (max-width:767px){ body{padding-bottom:64px} }
</style>
</head>
<body>

<!-- 固定ヘッダー -->
<div class="site-header" id="site-header">
  <div class="wrap">
    <a class="hdr-brand" href="lp-pop-rc.html">REALIZE <span>CLUB</span></a>
    <nav class="hdr-nav">
      <a href="lp-pop-rc.html">ホーム</a>
      <!-- 今このページなので、会社概要はリンクにせず現在地として見せる -->
      <span aria-current="page">会社概要</span>
      <a class="hdr-cta" href="https://lin.ee/ZXLuI95" target="_blank" rel="noopener">LINEで友だちになる</a>
    </nav>
  </div>
</div>

<main>
  <div class="wrap">
    <p class="page-tag">会社概要</p>
    <p class="lead">REALIZE CLUBの運営会社です。</p>
    <dl class="kaisha-table">
      <dt>商号</dt><dd>日本リアライズ株式会社</dd>
      <dt>設立</dt><dd>2009年1月20日</dd>
      <dt>代表者</dt><dd>代表取締役　大橋 孝行</dd>
      <dt>所在地</dt><dd>東京都新宿区新宿1丁目36番7号　新宿内野ビルII 3F、8F</dd>
      <dt>電話番号</dt><dd><a href="tel:0363805978">03-6380-5978</a>（代表）</dd>
    </dl>
    <a class="back" href="lp-pop-rc.html">← 前のページにもどる</a>
  </div>
</main>

<footer>
  <div class="wrap">
    <a class="footer-brand" href="https://n-realize.co.jp/" target="_blank" rel="noopener">REALIZE <span>CLUB</span></a>
    <nav>
      <a href="lp-pop-rc.html">ホーム</a>
      <a href="shiryou-pop-rc.html">資料請求</a>
    </nav>
    <p class="footer-copy">© 日本リアライズ株式会社</p>
  </div>
</footer>

<!-- スマホ追従ボタン -->
<div class="sticky"><a class="btn" href="https://lin.ee/ZXLuI95" target="_blank" rel="noopener">LINEで友だちになる</a></div>

<script>
  // 少しでもスクロールしたらヘッダーに下地の境界線を出す（lp-pop-rc.html と同じ）
  var hdr = document.getElementById('site-header');
  var onScroll = function () { hdr.classList.toggle('scrolled', window.scrollY > 8); };
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
</script>

</body>
</html>
